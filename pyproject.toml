[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "defi-research"
version = "0.4.0"
description = "DeFi Protocol Discovery, GitHub Resolution, Slither Static Analysis & Security Intelligence Suite"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "web3>=6.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5.0",
]
packaging = [
    "pyinstaller>=6.0.0",
]
all = [
    "PySide6>=6.5.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
defi-research = "cli:main"
defi-research-gui = "defi_research.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
